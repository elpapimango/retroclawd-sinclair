[workspace]
resolver = "2"
members = ["crates/machines/zx81", "crates/machines/zx-spectrum", "crates/plugins/zx81-machine-plugin", "crates/plugins/zx-spectrum-machine-plugin", "crates/plugin-dlls/zx81", "crates/plugin-dlls/zx-spectrum", "crates/formats/zx81-snapshot", "crates/formats/z80-snapshot", "crates/formats/sna-snapshot", "crates/formats/szx-snapshot", "crates/chips/sinclair-keyboard"]

# Same release profile as the retroclawd host.
[profile.release]
strip = true
opt-level = "s"

[profile.profiling]
inherits = "release"
debug = true

[profile.release.package.z80]
opt-level = 3

[profile.release.package.zx-spectrum]
opt-level = 3

[profile.release.package.zx81]
opt-level = 3

[profile.release.package.machine]
opt-level = 3

[profile.release.package.ay-3-8910]
opt-level = 3

[profile.release.package.zx-tape]
opt-level = 3

[profile.release.package.sinclair-keyboard]
opt-level = 3

[profile.release.package.nec765]
opt-level = 3

[profile.release.package.zx81-machine-plugin-dll]
strip = false

[profile.release.package.zx-spectrum-machine-plugin-dll]
strip = false
