# rcld build hello.toml -o hello.<tap|sna|z80|szx>   (scenarios/build.sh does all four into software/scenarios/)
machine = "spectrum"
name = "HELLO"
entry = "start"
output = "hello.sna"

[[input]]
asm = ["hello.asm"]

[[region]]
