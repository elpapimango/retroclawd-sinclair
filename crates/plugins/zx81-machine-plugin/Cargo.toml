[package]
name = "zx81-machine-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "zx81_machine_plugin_impl"

[dependencies]
machine = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "318a2cc4cc1d758aeebfe2a46f962c3506a8a0cf" }
serde = { version = "1", features = ["derive"] }
plugin-api = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "318a2cc4cc1d758aeebfe2a46f962c3506a8a0cf" }
z80 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "318a2cc4cc1d758aeebfe2a46f962c3506a8a0cf" }
zx81 = { path = "../../machines/zx81" }
zx81-snapshot = { path = "../../formats/zx81-snapshot" }
zx-tape = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "318a2cc4cc1d758aeebfe2a46f962c3506a8a0cf" }

[dev-dependencies]
toml = "0.8"
