[package]
name = "zx-spectrum-machine-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "zx_spectrum_machine_plugin_impl"

[dependencies]
build-info = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "e7a49632403a1206851dd187c094b3bb38acbe62" }
machine = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "e7a49632403a1206851dd187c094b3bb38acbe62" }
plugin-api = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "e7a49632403a1206851dd187c094b3bb38acbe62" }
serde = { version = "1", features = ["derive"] }
z80 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "e7a49632403a1206851dd187c094b3bb38acbe62" }
zx-spectrum = { path = "../../machines/zx-spectrum" }
z80-snapshot = { path = "../../formats/z80-snapshot" }
sna-snapshot = { path = "../../formats/sna-snapshot" }
szx-snapshot = { path = "../../formats/szx-snapshot" }
zx-tape = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "e7a49632403a1206851dd187c094b3bb38acbe62" }
dsk = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "e7a49632403a1206851dd187c094b3bb38acbe62" }

[dev-dependencies]
toml = "0.8"

[build-dependencies]
build-info = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "e7a49632403a1206851dd187c094b3bb38acbe62" }
