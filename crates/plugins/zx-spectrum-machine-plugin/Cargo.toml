[package]
name = "zx-spectrum-machine-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "zx_spectrum_machine_plugin_impl"

[dependencies]
machine = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "890781d4722d829fdb6658913355e3969dafd9bc" }
plugin-api = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "890781d4722d829fdb6658913355e3969dafd9bc" }
serde = { version = "1", features = ["derive"] }
z80 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "890781d4722d829fdb6658913355e3969dafd9bc" }
zx-spectrum = { path = "../../machines/zx-spectrum" }
z80-snapshot = { path = "../../formats/z80-snapshot" }
sna-snapshot = { path = "../../formats/sna-snapshot" }
szx-snapshot = { path = "../../formats/szx-snapshot" }
zx-tape = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "890781d4722d829fdb6658913355e3969dafd9bc" }
dsk = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "890781d4722d829fdb6658913355e3969dafd9bc" }

[dev-dependencies]
toml = "0.8"
