[package]
name = "zx-spectrum-machine-plugin-dll"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Shared-library build of zx-spectrum-machine-plugin: only the C entry points, all logic lives in zx-spectrum-machine-plugin"

[lib]
name = "zx_spectrum_machine_plugin"
crate-type = ["cdylib"]

[dependencies]
plugin-api = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "00edb656a76f8b920b0e22fd27f2e39dfb4056a9" }
zx-spectrum-machine-plugin = { path = "../../plugins/zx-spectrum-machine-plugin" }
