machine = "zx-spectrum-128"
# Goldens are the 256x192 picture only (capture_zesarux_screen.py --crop 48,56,256,192; the border is not compared),
# compared with retroclawd's picture without its border (--no-border).
# Not covered: S2 (typed input) because ZEsarUX's ASCII typing cannot move the 128K menu's selection (cursor keys), so
# there is no way to reach 128 BASIC in the reference; S4 (beeper, AY) and S7 (hardware test ROMs) are not here yet.
args = ["--no-border"]

[reference]
emulator = "zesarux"
version = "13.0"
command = "retroclawd-tools/scripts/capture_zesarux_screen.py 128k 6 OUT.png --crop 48,56,256,192 [--load FILE --seconds 25]   (zesarux --machine 128k --realvideo, save-screen over ZRCP)"

[files]
rom = "sinclair/roms/zx-spectrum/128.rom"

[[scenario]]
id = "S1"
kind = "screen"
frames = 250
golden = "zxs128/S1-boot.png"
golden_sha256 = "6f412038e1f8c38baec735a805f1a3578ebeb6ee0ecd53ca0f285003e4bc4431"
compare = { mode = "similarity", normalize = true, max_mad = 2.0, crop = [0.23, 0.30, 0.65, 0.575], reason = "the other emulator draws the Spectrum non-bright white as 0xC0 and ours as 0xCD; the crop is inside the start menu box (Tape Loader, 128 BASIC, Calculator, 48 BASIC, Tape Tester), which is bright white and so identical in both, the pictures having been compared pixel by pixel and differing only in that ground colour" }

# The start menu opens on Tape Loader: Enter runs LOAD "" with the tape attached; --fast-tape-load keeps the run short.
[[scenario]]
id = "S3-tap"
kind = "screen"
frames = 900
args = ["--fast-tape-load"]
files = { tape = "sinclair/software/scenarios/spectrum-hello.tap" }
actions = ["150:key_down=Enter", "158:key_up=Enter"]
golden = "zxs128/S3-tap.png"
golden_sha256 = "28d4ea746be184517a9d9de5e5896bfda3b97554690e1e53c46511c07d38456e"
compare = { mode = "similarity", normalize = true, max_mad = 2.0, crop = [0.0, 0.0, 0.2, 0.06], reason = "the other emulator draws the Spectrum white as 0xC0 and ours as 0xCD (normalize stretches both pictures to the full range) and rasterises differently; the crop is the top-left cells where the loaded program (a .tap with a BASIC loader made by rcld) writes HELLO" }

[[scenario]]
id = "S5"
kind = "state"
frames = 400
more_frames = 100
actions = ["150:key_down=Enter", "158:key_up=Enter"]

# S6: the machine runs whole instructions, so a frame ends up to one instruction (at most 23 T-states) late.
[[scenario]]
id = "S6"
kind = "timing"
frames = 100
cycles_per_frame = 70908
cycles_tolerance = 23
